<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#0A4EE4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#0A4EE4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A4EE4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Glowing outer ring / Opera 'O' -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#blueGrad)" stroke-width="48" filter="url(#shadow)"/>
  
  <!-- Digital Accent Nodes -->
  <circle cx="256" cy="116" r="18" fill="#60A5FA"/>
  <circle cx="396" cy="256" r="14" fill="#38BDF8"/>
  
  <!-- Central Spark / Opera symbol element -->
  <path d="M256 186 L272 240 L326 256 L272 272 L256 326 L240 272 L186 256 L240 240 Z" fill="url(#glowGrad)"/>
</svg>
